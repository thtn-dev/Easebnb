name: Server CI

on:
  push:
    branches:
      - build/develop
    paths:
      - 'server/**'

  pull_request:
    paths:
      - 'server/**'

  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore server/Easebnb.slnx

      - name: Build
        run: dotnet build server/Easebnb.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test server/Easebnb.slnx --configuration Release --no-build